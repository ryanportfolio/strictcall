<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strictcall</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1a1d23;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --border: #e5e7eb;
    --user: #4f46e5;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: -0.2px; }
  header .sub { color: var(--muted); font-size: 13px; }
  header button {
    margin-left: auto;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  header button:hover { color: var(--ink); border-color: var(--muted); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0 12px;
  }
  .lane { max-width: 780px; margin: 0 auto; padding: 0 22px; }
  .msg { margin: 10px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .agent .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble code {
    font-family: var(--mono);
    font-size: 13px;
    background: rgba(0,0,0,0.06);
    padding: 1px 5px;
    border-radius: 5px;
  }
  .user .bubble code { background: rgba(255,255,255,0.2); }
  .tools { margin: 6px 0 2px; }
  .chip {
    display: inline-block;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid #dfe3ff;
    border-radius: 999px;
    padding: 2px 10px;
    margin-right: 6px;
  }
  details.sql {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  details.sql summary { cursor: pointer; user-select: none; }
  details.sql pre {
    font-family: var(--mono);
    font-size: 12.5px;
    background: #0f172a;
    color: #e2e8f0;
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    white-space: pre-wrap;
  }
  .caveat { color: #b45309; font-size: 13px; margin-top: 6px; }
  .error { color: #b91c1c; }
  #starters { text-align: center; padding: 40px 22px 10px; }
  #starters p { color: var(--muted); margin: 0 0 16px; }
  #starters button {
    display: block;
    margin: 8px auto;
    max-width: 560px;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
  }
  #starters button:hover { border-color: var(--accent); color: var(--accent); }
  form {
    display: flex;
    gap: 10px;
    max-width: 780px;
    margin: 0 auto;
    padding: 12px 22px 18px;
    width: 100%;
  }
  input[type=text] {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
    background: var(--panel);
  }
  input[type=text]:focus { border-color: var(--accent); }
  form button {
    border: 0;
    background: var(--accent);
    color: #fff;
    border-radius: 12px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
  }
  form button:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>strictcall</h1>
  <span class="sub">ask the loyalty warehouse anything</span>
  <button id="reset" type="button">new conversation</button>
</header>

<div id="chat">
  <div class="lane" id="messages">
    <div id="starters">
      <p>Every answer comes from SQL the agent writes and runs against the warehouse.</p>
      <button>Which members are within 500 points of the next tier?</button>
      <button>How many Platinum members are there, and who are they?</button>
      <button>What was the total of points earned per month in 2025?</button>
      <button>What is a Gold member's average current balance worth in USD?</button>
    </div>
  </div>
</div>

<form id="form">
  <input id="input" type="text" placeholder="Ask a question about the loyalty program data" autocomplete="off" autofocus>
  <button id="send" type="submit">Send</button>
</form>

<script>
const messages = document.getElementById("messages");
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const starters = document.getElementById("starters");

let sessionId = newSession();
function newSession() { return "ui-" + crypto.randomUUID(); }

document.getElementById("reset").addEventListener("click", () => {
  sessionId = newSession();
  messages.querySelectorAll(".msg").forEach((el) => el.remove());
  starters.style.display = "";
  input.focus();
});

starters.addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON") ask(e.target.textContent);
});

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (q) ask(q);
});

function el(tag, cls, parent) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (parent) parent.appendChild(node);
  return node;
}

function esc(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Minimal markdown: escape first, then bold and inline code only.
function render(text) {
  return esc(text)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

async function ask(question) {
  starters.style.display = "none";
  input.value = "";
  send.disabled = true;
  input.disabled = true;

  const user = el("div", "msg user", messages);
  el("div", "bubble", user).textContent = question;

  const agent = el("div", "msg agent", messages);
  const bubble = el("div", "bubble", agent);
  const tools = el("div", "tools", bubble);
  const body = el("div", "body", bubble);
  body.innerHTML = '<span class="typing">thinking&hellip;</span>';
  chat.scrollTop = chat.scrollHeight;

  let text = "";
  try {
    const res = await fetch("/invocations", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Amzn-Bedrock-AgentCore-Runtime-Session-Id": sessionId,
      },
      body: JSON.stringify({ prompt: question, stream: true }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text()));

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let split;
      while ((split = buffer.indexOf("\n\n")) >= 0) {
        const raw = buffer.slice(0, split);
        buffer = buffer.slice(split + 2);
        if (!raw.startsWith("data: ")) continue;
        const event = JSON.parse(raw.slice(6));
        if (event.tool) {
          el("span", "chip", tools).textContent = event.tool;
        } else if (event.delta) {
          text += event.delta;
          body.innerHTML = render(text);
        } else if (event.answer) {
          finish(bubble, event.answer);
        }
        chat.scrollTop = chat.scrollHeight;
      }
    }
    if (!text) body.innerHTML = '<span class="typing">(no answer text)</span>';
  } catch (err) {
    body.innerHTML = '<span class="error">' + esc(String(err)) + "</span>";
  } finally {
    send.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

function finish(bubble, answer) {
  if (answer.sql_used && answer.sql_used.length) {
    const details = el("details", "sql", bubble);
    el("summary", "", details).textContent =
      "SQL the agent ran (" + answer.sql_used.length + ")";
    const pre = el("pre", "", details);
    pre.textContent = answer.sql_used.join("\n\n");
  }
  (answer.data_caveats || []).forEach((caveat) => {
    el("div", "caveat", bubble).textContent = "⚠ " + caveat;
  });
}
</script>
</body>
</html>
